name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest vX.Y.Z tag (ignored when version is set)
        type: choice
        options: [none, patch, minor, major]
        default: none
      version:
        description: Exact version to release, vX.Y.Z (overrides bump)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      make-latest: ${{ steps.pick.outputs.make-latest }}
      previous: ${{ steps.pick.outputs.previous }}

    steps:
      - name: Check branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release from main, not $GITHUB_REF"
            exit 1
          fi

      - name: Pick the version
        id: pick
        uses: sagikazarmark/next-version@e291b39a83bf84c948c419871f910173bf8343dc # v0.2.0
        with:
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}

  package:
    name: Package
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      # `cargo publish --dry-run`, not `cargo package`: it skips `publish = false` crates.
      - name: Bump the version and package every crate
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo release version "$VERSION" --execute --no-confirm
          cargo publish --dry-run --workspace --locked --allow-dirty

  commit:
    name: Commit
    needs: [version, package]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Set up git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump and commit the version
        id: commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cargo release version "$VERSION" --execute --no-confirm

          if ! git diff --quiet; then
            git commit -am "chore: release $TAG"
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    needs: [version, commit]
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          args=()

          for crate in $(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.publish != []) | .name'); do
            cargo info --registry crates-io "$crate@$VERSION" >/dev/null 2>&1 || args+=(-p "$crate")
          done

          [[ ${#args[@]} -eq 0 ]] || cargo publish --locked --no-verify "${args[@]}"

  release:
    name: GitHub Release
    needs: [version, commit, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ needs.commit.outputs.sha }}
          LATEST: ${{ needs.version.outputs.make-latest }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --generate-notes \
            --latest="$LATEST" \
            ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
