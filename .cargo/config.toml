# wasm32-unknown-unknown builds inside this repository (tests, `just wasm`): route `getrandom`
# through `crypto.getRandomValues` — the `js` features enable the backend, the final build must
# select it — and run test binaries under Node through wasm-bindgen-test-runner. Applications set
# the same cfg themselves.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
runner = "wasm-bindgen-test-runner"
