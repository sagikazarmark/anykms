[package]
name = "anykms-transit"
version.workspace = true
description = "HashiCorp Vault and OpenBao transit backend for anykms"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kms", "vault", "openbao", "transit", "hashicorp"]
categories = ["cryptography", "api-bindings"]
# Tests are not published: no test sources or test keys in the package.
exclude = ["tests/"]

[features]
default = ["reqwest", "rustls-aws-lc-rs"]
# The built-in HTTP transport (`anykms_http::ReqwestTransport`), used when `ServerConfig::http_transport`
# is not set. Without it a transport must be injected.
reqwest = ["anykms-http/reqwest"]
# TLS crypto provider for the built-in transport, used when neither a configured provider nor a
# process-wide default (`rustls::crypto::CryptoProvider::install_default`) is set: those two win
# over the features. Both may be enabled (features unify): aws-lc-rs then wins. anykms-http
# selects it. aws-lc-rs is the default (it builds C and assembly: a C compiler is needed); ring
# is opt-in with `default-features = false` and `rustls-ring`. `ReqwestTransport`-only.
rustls-ring = ["anykms-http/rustls-ring"]
rustls-aws-lc-rs = ["anykms-http/rustls-aws-lc-rs"]
# Spans and events for every operation (field allowlist; never data).
tracing = ["dep:tracing", "anykms-http/tracing"]
# Allow HTTP/2 in the built-in transport (`ReqwestTransportBuilder::http2`). `ReqwestTransport`-only.
http2 = ["anykms-http/http2"]
# `anykms_http::TowerTransport`: any tower `Service` as the transport (`.http_transport(..)`).
tower = ["anykms-http/tower"]
# `wasm32-unknown-unknown` on a JS host (Cloudflare Workers): clocks and RNG read the host. Pair it
# with a transport that runs there (`tower` over a `fetch` service).
js = ["anykms-core/js", "anykms-http/js"]

[dependencies]
anykms-core.workspace = true
# The transport seam and the built-in transport, zeroizing buffers, transport errors.
anykms-http.workspace = true

zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
getrandom.workspace = true
# `*_CAPATH` validation (every file must parse as PEM certificates).
rustls-pki-types = { workspace = true, features = ["std"] }
tracing = { workspace = true, optional = true }
# One login or renewal at a time (`Login`).
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK for opening token files (no unsafe code).
libc = "0.2"

[dev-dependencies]
anykms-conformance.workspace = true
# Unpublished test helpers: a path-only dev-dependency, which `cargo publish` strips.
anykms-testkit = { path = "../anykms-testkit" }
anykms-recipes.workspace = true

# Formats the HTTP-date `Retry-After` the mock server sends (tests/mock.rs).
httpdate = "1"
tokio.workspace = true
wiremock.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["json"] }
# Test-side TLS clients (fixture admin, integration) use ring, whatever provider the library uses.
rustls = { workspace = true, features = ["ring"] }
rustls-pki-types.workspace = true
libtest-mimic.workspace = true

[[test]]
name = "integration"
harness = false

[[test]]
name = "conformance_vault"
harness = false

[[test]]
name = "conformance_openbao"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
