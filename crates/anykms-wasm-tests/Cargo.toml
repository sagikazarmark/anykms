[package]
name = "anykms-wasm-tests"
version.workspace = true
description = "wasm32-unknown-unknown smoke tests for the transport-free anykms crates (and the tower transport) on a JS host; never published"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published: `just wasm` runs it under Node. On every other target it is an empty crate
# (no tests), so workspace-wide commands stay green.
publish = false

[lib]
# Nothing to document or test natively; the wasm32 integration test is the whole point.
doctest = false
test = false

# The core unit tests of `anykms_core::time` cover the std clock natively; this crate holds what
# only a JS host can show: the `js` clocks and RNG actually work where `std::time` panics.
#
# anykms-aws and anykms-http's `tower` and `js` features are the Cloudflare Workers shape (a backend
# over a `TowerTransport`, no reqwest, every clock on the host's): the backend must build for the
# target and perform an operation on it. The `fetch` service itself (`tower-worker-fetch`) needs
# workerd and is not driven here. anykms-gcp and anykms-azure are here for one thing: their
# link-local credential sources (metadata server, IMDS) must fail with a `Configuration` error
# on this target, without a probe.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
anykms-core = { workspace = true, features = ["js"] }
anykms-recipes = { workspace = true, default-features = false, features = ["js", "jose", "envelope", "rsa-rustcrypto"] }
anykms-local = { workspace = true, features = ["js"] }
anykms-http = { workspace = true, features = ["tower", "js"] }
anykms-aws = { workspace = true, features = ["rsa-rustcrypto", "js"] }
anykms-gcp = { workspace = true, features = ["rsa-rustcrypto", "js"] }
anykms-azure = { workspace = true, features = ["rsa-rustcrypto", "js"] }
tower-service.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
js-sys.workspace = true
wasm-bindgen-test = "0.3"
serde_json.workspace = true
base64.workspace = true

[lints]
workspace = true

[package.metadata.release]
release = false
