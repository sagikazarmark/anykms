[package]
name = "anykms-http"
version.workspace = true
description = "HTTP plumbing shared by the anykms backends (the HttpTransport seam, the reqwest transport, TLS provider selection, zeroizing bodies, credential caching, server-message redaction); not for direct use"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kms", "anykms"]
categories = ["cryptography"]
# The published crate ships no tests/: its data are throwaway test keys and certificates (the
# unit tests that read them skip when run from the package).
exclude = ["tests/"]

[features]
default = ["reqwest", "rustls-aws-lc-rs"]
# The built-in transport (`ReqwestTransport`): reqwest over rustls. Without it a backend must be
# given a transport through its builder (`.http_transport(..)`).
reqwest = ["dep:reqwest", "rustls", "tokio/rt"]
# The rustls client configuration (`tls`): roots, client certificates, the crypto provider.
# `ReqwestTransport` needs it; another transport built on rustls may reuse it.
rustls = ["dep:rustls", "dep:rustls-native-certs"]
# TLS crypto provider, used when neither a configured provider nor a process-wide default
# (`rustls::crypto::CryptoProvider::install_default`) is set: those two win over the features.
# aws-lc-rs is the default (it builds C and assembly: a C compiler is needed); ring is opt-in
# with `default-features = false, features = ["rustls-ring"]`. Both may be enabled (features
# unify): aws-lc-rs then wins. They only affect `ReqwestTransport` (and `tls`).
rustls-ring = ["rustls", "rustls/ring"]
rustls-aws-lc-rs = ["rustls", "rustls/aws-lc-rs"]
# A debug event naming the selected TLS crypto provider; the span schema (`span`, `request_span!`,
# `token_span!`), which are no-ops without it.
tracing = ["dep:tracing"]
# Allow HTTP/2 in `ReqwestTransport` (`ReqwestTransportBuilder::http2`). `ReqwestTransport`-only.
http2 = ["reqwest?/http2"]
# `TowerTransport<S>`: any tower `Service` over `http::Request<Full<Bytes>>` as a transport
# (a tower stack around the built-in client through `ReqwestTransport::into_service`, or a
# `fetch`-based service on Cloudflare Workers). Off by default; adds no dependency when off.
tower = ["dep:tower-service", "dep:http-body", "dep:http-body-util", "dep:bytes"]
# `wasm32-unknown-unknown` on a JS host: the clocks (`anykms_core::time`) and RNG read the host.
# Only meaningful with a transport that runs there (`tower` over a `fetch` service).
js = ["anykms-core/js", "getrandom/wasm_js"]

[dependencies]
anykms-core.workspace = true

zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
http.workspace = true
url.workspace = true
reqwest = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
httpdate = "1"
# Keyed fingerprints of server messages (`redact`).
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, features = ["std"] }
tracing = { workspace = true, optional = true }
# Single flight (`cache::SingleFlight`) and the credential cache's clock (`tokio::time::Instant`,
# so paused test time moves it); `ReqwestTransport`'s runtime check adds `rt` (`Handle::try_current`).
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# `ServiceBuilder` layers for the `TowerTransport` tests.
tower = { workspace = true, features = ["util", "limit", "timeout"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
