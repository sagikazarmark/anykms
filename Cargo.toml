[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/anykms"

[workspace.dependencies]
anykms-core = { path = "crates/anykms-core", version = "0.1.0" }
# Without default features: each user picks the RSA backend (`rsa-aws-lc-rs` or `rsa-rustcrypto`;
# the facade and the cloud backends default to `rsa-aws-lc-rs`) and the `jose`/`envelope` recipes
# it uses. With no RSA backend, RSA verification fails at run time.
anykms-recipes = { path = "crates/anykms-recipes", version = "0.1.0", default-features = false }
anykms-local = { path = "crates/anykms-local", version = "0.1.0" }
anykms-transit = { path = "crates/anykms-transit", version = "0.1.0", default-features = false }
anykms-aws = { path = "crates/anykms-aws", version = "0.1.0", default-features = false }
anykms-azure = { path = "crates/anykms-azure", version = "0.1.0", default-features = false }
# Without default features: each backend forwards its own `rustls-*` provider features.
anykms-http = { path = "crates/anykms-http", version = "0.1.0", default-features = false }
anykms-gcp = { path = "crates/anykms-gcp", version = "0.1.0", default-features = false }
anykms-conformance = { path = "crates/anykms-conformance", version = "0.1.0" }

trait-variant = "0.1.3"
# 1.9.1 or later: 1.9.0's `Zeroizing` `Debug` prints its contents, such as a decrypted plaintext.
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
secrecy = "0.10.3"
subtle = "2.6"
tracing = "0.1.41"

# RustCrypto (digest 0.11 / signature 3 stack)
# `zeroize`: hash and HMAC states (HKDF over a data key, local HMAC keys) are wiped on drop.
sha2 = { version = "0.11", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
hkdf = "0.13"
aes-gcm = { version = "0.11", features = ["zeroize"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.17", features = ["der", "pkcs8", "algorithm"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
# 0.10 is an RC but is the release built on the digest-0.11/signature-3 stack (PLAN §9). Used for
# public-key verification only, and only with anykms-recipes' opt-in `rsa-rustcrypto` feature (the
# default RSA backend is aws-lc-rs, so no default build depends on the RC). A caret requirement,
# not an exact pin, so applications can take later 0.10 RCs and 0.10.0 itself (and share one `rsa`
# with their other dependencies); Cargo.lock pins what CI tests.
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["sha2", "encoding", "std"] }
# The default RSA verification backend (anykms-recipes' `rsa-aws-lc-rs` feature).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
spki = "0.8"
signature = "3"
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
# Portability (wasm32-unknown-unknown): `std::time::{Instant, SystemTime}::now` panic there.
web-time = "1.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# No crypto provider here: anykms-transit selects ring or aws-lc-rs with its `rustls-*` features.
rustls = { version = "0.23.42", default-features = false, features = ["std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
libtest-mimic = "0.8"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
