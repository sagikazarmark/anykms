[package]
name = "anykms-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anykms-core = { path = "../crates/anykms-core" }
anykms-recipes = { path = "../crates/anykms-recipes" }
anykms-local = { path = "../crates/anykms-local" }
anykms-transit = { path = "../crates/anykms-transit" }
anykms-aws = { path = "../crates/anykms-aws" }
base64 = "0.23"
anykms-gcp = { path = "../crates/anykms-gcp" }
anykms-azure = { path = "../crates/anykms-azure" }

[workspace]
members = ["."]

[profile.release]
debug = 1

